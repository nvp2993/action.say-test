<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LỊCH SHOW ACTION &amp; SAY</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ACTION x SAY">

  <link id="favicon-link" rel="icon" type="image/png" href="./assets/logo.png">
  <link id="apple-touch-icon-link" rel="apple-touch-icon" sizes="180x180" href="./assets/logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col">

  <div id="app" class="flex-1 flex flex-col min-h-0 bg-white"></div>

  <!-- Portal cho các Modal tầng trên (Thẻ VIP, Cài đặt Pro, Thông báo, Xem ảnh) -->
  <div id="as-super-portal"></div>

  <!-- Input file ẩn dùng chung -->
  <input id="excel-file-picker" type="file" accept=".xlsx,.xls,.csv" class="hidden">
  <input id="logo-file-picker" type="file" accept="image/*" class="hidden">
  <input id="json-restore-picker" type="file" accept=".json" class="hidden">
  <input id="avatar-file-picker" type="file" accept="image/*" class="hidden">

  <script type="module" src="./js/app.js"></script>
</body>
</html>
